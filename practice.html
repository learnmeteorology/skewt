<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · Skew-T Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
</head>
<body class="quiz-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Skew-T Guide home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8"/><path class="g" d="M8 26 13 17 11 12 16 6"/><path class="r" d="M20 26 17 18 22 13 25 6"/></svg>
      <span>Skew-T Guide</span>
    </a>
    <nav class="tabs" aria-label="Pages">
      <a href="index.html">Start</a>
      <a href="build.html">Learn</a>
      <a href="explore.html">Explore</a>
      <a href="practice.html" aria-current="page">Practice</a>
      <a href="test.html">Test</a>
    </nav>
    <button id="theme" type="button"></button>
  </header>
  <main class="quiz">
    <h1 class="sr-only">Practice identifying chart features and plotting data</h1>
    <figure class="quiz-chart">
      <button class="zoom" type="button" aria-pressed="false">Zoom in on chart</button>
      <div class="chart-scroll">
        <svg id="quizchart" viewBox="0 0 820 760" role="img"></svg>
      </div>
    </figure>
    <section class="quiz-card" id="card">
      <div class="sections" role="group" aria-label="Skill to practice">
        <button type="button" data-skill="find">Identify features</button>
        <button type="button" data-skill="plot">Plot data</button>
      </div>
      <div class="quiz-top">
        <label>Sounding <select id="sounding"></select></label>
        <span id="qcount" class="count"></span>
      </div>
      <h2 id="question" tabindex="-1"></h2>
      <div id="figure"></div>
      <p id="feedback" aria-live="polite"></p>
      <div class="quiz-actions"><button id="reveal" type="button" hidden>Show me</button><button id="repeat" type="button" hidden>Practice these again</button><button id="qnext" class="primary" type="button" hidden>Next</button></div>
    </section>
  </main>
  <script src="js/thermo.js"></script>
  <script src="js/soundings.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/quiz-chart.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/zoom.js"></script>
</body>
</html>
